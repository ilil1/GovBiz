[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govbiz-evaluation-engine"
version = "0.1.0"
description = "GovBiz evaluation, budgeting and reports without web-service imports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "govbiz-ai-runtime==0.1.0",
    "govbiz-evaluation-contracts==0.1.0",
    "pandas==3.0.6",
    "pandera[pandas]==0.33.1",
    "evidently==0.7.23",
]

[tool.setuptools]
packages = ["govbiz_evaluation", "govbiz_evaluation.evaluators", "govbiz_evaluation.reports", "govbiz_evaluation.integrations", "govbiz_evaluation.preparation"]
package-dir = { govbiz_evaluation = "govbiz_evaluation" }
include-package-data = false

[tool.uv.sources]
govbiz-ai-runtime = { path = "../../packages/govbiz-ai-runtime" }
govbiz-evaluation-contracts = { path = "../../packages/govbiz-evaluation-contracts" }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "govbiz_evaluation/*.py" }, { file = "govbiz_evaluation/evaluators/*.py" }, { file = "govbiz_evaluation/reports/*.py" }, { file = "govbiz_evaluation/integrations/*.py" }, { file = "govbiz_evaluation/preparation/*.py" }]
